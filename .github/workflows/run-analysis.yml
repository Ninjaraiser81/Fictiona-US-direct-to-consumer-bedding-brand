name: Run AsterVale Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements(1).txt

      - name: Install dependencies
        run: python -m pip install -r "requirements(1).txt"

      - name: Run analysis
        run: python run_analysis.py

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: astervale-analysis-results
          path: |
            outputs/
            executive_memo.pdf
          if-no-files-found: error
